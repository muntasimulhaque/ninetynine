name: Capture Play screenshots

# Renders the five listing screens (home light, name page, home dark, quiz,
# memorize) directly via an instrumentation screenshot test — no adb
# navigation of the running app — on a phone, 7-inch and 10-inch emulator,
# and uploads the PNGs as artifacts.
#
# The emulator infrastructure mirrors the proven screenshots.yml of the
# count-and-play repo (API 35, KVM enabled, snapshot-less boots, cached AVDs):
# that setup runs all three legs in about five minutes. The previous setup
# (API 34, Nexus 10 profile, no KVM step) crawled for 45+ minutes and flaked
# in teardown on the tablets.
#
# Artifacts: screenshots-<device>/<device>-<scene>.png for the five scenes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-main
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_2
          - device: 7in
            profile: Nexus 7
          - device: 10in
            profile: pixel_c
    env:
      # The newest image that boots reliably on hosted runners; the app's
      # targetSdk (37) gains nothing for listing captures. Same pin the
      # count-and-play repo uses.
      API_LEVEL: "35"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      # Hardware acceleration for the emulator on the GitHub runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The AVD is expensive to cold-create; cache it per form factor so only
      # the first leg pays for it.
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ matrix.profile }}

      - name: Create AVD and generate a snapshot to cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Run screenshot capture on emulator
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            # A cold boot can report completion before emulated storage is
            # mounted; wait it out or the test's output dir breaks.
            for i in $(seq 1 60); do adb -s emulator-5554 shell ls /sdcard/Android >/dev/null 2>&1 && break; sleep 2; done
            # The slow tablet emulators can flake AFTER every PNG is saved: the
            # final activity teardown sometimes times out ("Activity never
            # becomes [DESTROYED]"), failing gradle without harming the
            # captures. The deliverable is the PNGs: pull them regardless, then
            # fail the leg only if an expected PNG is missing or empty, so a
            # crashed scene or a skipped test still goes red. (The capture
            # itself retries PixelCopy; see ScreenshotTest.)
            ./gradlew :app:connectedDebugAndroidTest --console=plain || echo "WARNING: connectedDebugAndroidTest reported failures; verifying captures directly"
            mkdir -p /tmp/screenshots
            for f in home home-dark name quiz memorize; do adb exec-out run-as io.github.muntasimulhaque.ninetynine cat /data/data/io.github.muntasimulhaque.ninetynine/files/screenshots/$f.png > /tmp/screenshots/${{ matrix.device }}-$f.png || true; done
            ls -la /tmp/screenshots
            missing=0
            for f in home home-dark name quiz memorize; do
              if [ ! -s "/tmp/screenshots/${{ matrix.device }}-$f.png" ]; then
                echo "MISSING OR EMPTY: ${{ matrix.device }}-$f.png"
                missing=$((missing+1))
              fi
            done
            if [ "$missing" -gt 0 ]; then
              echo "$missing PNG(s) missing; failing the leg"
              exit 1
            fi
