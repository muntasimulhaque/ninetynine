name: Capture Play screenshots

# Renders the five listing screens (home light, name page, home dark, quiz,
# memorize) directly via an instrumentation screenshot test — no adb
# navigation of the running app — so it works reliably on the slow CI tablet
# emulators. Runs on a phone, 7-inch and 10-inch emulator and uploads the
# PNGs as artifacts.
#
# Artifacts: screenshots-<device>/<device>-home.png, -name.png, -home-dark.png,
# -quiz.png, -memorize.png

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_4
          - device: 7in
            profile: Nexus 7
          - device: 10in
            profile: Nexus 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Capture screenshots (${{ matrix.device }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            # The slow CI tablet emulators can flake AFTER every PNG is saved:
            # the final activity teardown sometimes times out ("Activity never
            # becomes [DESTROYED]"), which fails gradle without harming the
            # captures. The deliverable is the PNGs: pull them regardless, then
            # fail the leg only if any expected PNG is missing or empty, so a
            # crashed scene or a skipped test still goes red.
            gradle connectedDebugAndroidTest --console=plain || echo "WARNING: connectedDebugAndroidTest reported failures; verifying captures directly"
            mkdir -p /tmp/screenshots
            for f in home home-dark name quiz memorize; do adb exec-out run-as io.github.muntasimulhaque.ninetynine cat /data/data/io.github.muntasimulhaque.ninetynine/files/screenshots/$f.png > /tmp/screenshots/${{ matrix.device }}-$f.png || true; done
            ls -la /tmp/screenshots
            missing=0
            for f in home home-dark name quiz memorize; do
              if [ ! -s "/tmp/screenshots/${{ matrix.device }}-$f.png" ]; then
                echo "MISSING OR EMPTY: ${{ matrix.device }}-$f.png"
                missing=$((missing+1))
              fi
            done
            if [ "$missing" -gt 0 ]; then
              echo "$missing PNG(s) missing; failing the leg"
              exit 1
            fi

      - name: Upload ${{ matrix.device }} screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}
          path: /tmp/screenshots/*.png